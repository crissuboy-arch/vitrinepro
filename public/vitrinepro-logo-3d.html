<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitrinePro — Logo 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }

  /* Fundo removido — iframe é transparente */

  /* Container principal */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Aura de brilho atrás do V */
  .glow-ring {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,169,107,0.12) 0%, rgba(200,169,107,0.05) 40%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -60%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  }

  /* SVG 3D do V */
  .logo-wrap {
    position: relative;
    width: 260px;
    height: 240px;
    perspective: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .v-scene {
    width: 220px;
    height: 220px;
    transform-style: preserve-3d;
    animation: rotateY 8s ease-in-out infinite, float 4s ease-in-out infinite;
    position: relative;
  }

  @keyframes rotateY {
    0%   { transform: rotateY(-20deg) rotateX(5deg); }
    25%  { transform: rotateY(20deg) rotateX(-3deg); }
    50%  { transform: rotateY(15deg) rotateX(5deg); }
    75%  { transform: rotateY(-15deg) rotateX(-3deg); }
    100% { transform: rotateY(-20deg) rotateX(5deg); }
  }

  @keyframes float {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -14px; }
  }

  /* SVG principal — V com profundidade */
  .v-svg {
    width: 220px;
    height: 220px;
    filter: drop-shadow(0 0 30px rgba(200,169,107,0.7)) drop-shadow(0 0 60px rgba(200,169,107,0.3));
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(200,169,107,0.6)) drop-shadow(0 0 50px rgba(200,169,107,0.25)); }
    50% { filter: drop-shadow(0 0 40px rgba(200,169,107,0.9)) drop-shadow(0 0 80px rgba(200,169,107,0.45)) drop-shadow(0 0 120px rgba(200,169,107,0.2)); }
  }

  /* Partículas flutuantes */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: #C8A96B;
    animation: particleFloat linear infinite;
    opacity: 0;
  }

  .p1 { width:3px; height:3px; left:10%; top:20%; animation-duration:6s; animation-delay:0s; }
  .p2 { width:2px; height:2px; left:85%; top:30%; animation-duration:8s; animation-delay:1s; }
  .p3 { width:4px; height:4px; left:50%; top:10%; animation-duration:7s; animation-delay:2s; }
  .p4 { width:2px; height:2px; left:20%; top:70%; animation-duration:9s; animation-delay:0.5s; }
  .p5 { width:3px; height:3px; left:75%; top:65%; animation-duration:6.5s; animation-delay:3s; }
  .p6 { width:2px; height:2px; left:40%; top:85%; animation-duration:7.5s; animation-delay:1.5s; }
  .p7 { width:3px; height:3px; left:90%; top:50%; animation-duration:5.5s; animation-delay:2.5s; }
  .p8 { width:2px; height:2px; left:5%; top:50%; animation-duration:8.5s; animation-delay:0.8s; }

  @keyframes particleFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
  }

  /* Circuitos decorativos (como no logo original) */
  .circuits {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    pointer-events: none;
    opacity: 0.5;
    animation: circuitPulse 4s ease-in-out infinite;
  }

  @keyframes circuitPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* Textos */
  .brand-text {
    margin-top: 8px;
    text-align: center;
    animation: fadeInUp 1.2s ease forwards;
    opacity: 0;
    animation-delay: 0.5s;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
  }

  .brand-name span:first-child { color: #FFFFFF; }
  .brand-name span:last-child { color: #C8A96B; }

  .brand-tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: rgba(200,169,107,0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 10px;
    font-weight: 300;
  }

  /* Linha decorativa */
  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #C8A96B, transparent);
    margin: 14px auto 0;
    animation: fadeInUp 1.2s ease forwards;
    opacity: 0;
    animation-delay: 0.8s;
  }

  /* Código para copiar — canto */
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(200,169,107,0.4);
    letter-spacing: 1px;
    font-family: 'DM Sans', sans-serif;
  }
</style>
</head>
<body>

<!-- Partículas -->
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>
<div class="particle p8"></div>

<div class="container">
  <div class="glow-ring"></div>

  <div class="logo-wrap">
    <div class="v-scene">

      <!-- V 3D em SVG com gradientes dourados e efeito de profundidade -->
      <svg class="v-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradiente dourado principal -->
          <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE08A"/>
            <stop offset="30%" stop-color="#C8A96B"/>
            <stop offset="60%" stop-color="#F5D06A"/>
            <stop offset="100%" stop-color="#8B6914"/>
          </linearGradient>

          <!-- Gradiente para face esquerda do V (mais escura = profundidade) -->
          <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C8A96B"/>
            <stop offset="100%" stop-color="#6B4F10"/>
          </linearGradient>

          <!-- Gradiente para face direita do V (mais clara = luz) -->
          <linearGradient id="goldRight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFE59A"/>
            <stop offset="50%" stop-color="#D4A843"/>
            <stop offset="100%" stop-color="#9A7320"/>
          </linearGradient>

          <!-- Brilho/reflexo -->
          <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
            <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>

          <!-- Gradiente para efeito inner shadow -->
          <linearGradient id="innerV" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#FFF0A0"/>
            <stop offset="20%" stop-color="#E8C060"/>
            <stop offset="70%" stop-color="#C8A96B"/>
            <stop offset="100%" stop-color="#7A5A15"/>
          </linearGradient>

          <!-- Glow filter -->
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Glow forte para highlight -->
          <filter id="glowStrong">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Gradiente circuitos -->
          <linearGradient id="circuit" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="transparent"/>
            <stop offset="50%" stop-color="#C8A96B"/>
            <stop offset="100%" stop-color="transparent"/>
          </linearGradient>
        </defs>

        <!-- ============================================ -->
        <!-- FACE TRASEIRA (sombra/profundidade) — offset -->
        <!-- ============================================ -->
        <!-- Lado esquerdo do V — face traseira -->
        <polygon
          points="20,30 65,30 110,155 85,155"
          fill="#3a2800"
          opacity="0.6"
          transform="translate(5,6)"
        />
        <!-- Lado direito do V — face traseira -->
        <polygon
          points="200,30 155,30 110,155 135,155"
          fill="#3a2800"
          opacity="0.6"
          transform="translate(5,6)"
        />
        <!-- V interior traseiro -->
        <polygon
          points="80,30 140,30 110,105"
          fill="#2a1a00"
          opacity="0.5"
          transform="translate(5,6)"
        />

        <!-- ============================================ -->
        <!-- FACES LATERAIS 3D (dar profundidade) -->
        <!-- ============================================ -->
        <!-- Face inferior esquerda (lateral) -->
        <polygon
          points="85,155 110,155 115,161 90,161"
          fill="url(#goldLeft)"
          opacity="0.8"
        />
        <!-- Face inferior direita (lateral) -->
        <polygon
          points="135,155 110,155 115,161 140,161"
          fill="url(#goldLeft)"
          opacity="0.6"
        />

        <!-- ============================================ -->
        <!-- V PRINCIPAL — FRENTE -->
        <!-- ============================================ -->

        <!-- Lado esquerdo do V exterior -->
        <polygon
          points="20,30 65,30 110,155 85,155"
          fill="url(#goldLeft)"
          filter="url(#glow)"
        />

        <!-- Lado direito do V exterior -->
        <polygon
          points="200,30 155,30 110,155 135,155"
          fill="url(#goldRight)"
          filter="url(#glow)"
        />

        <!-- V interior (o espaço negativo entre os dois lados) -->
        <polygon
          points="80,30 140,30 110,105"
          fill="#0F172A"
        />

        <!-- ============================================ -->
        <!-- V INTERNO (linha dupla — como no logo) -->
        <!-- ============================================ -->
        <!-- Esquerda interior -->
        <polygon
          points="72,30 92,30 110,92 99,92"
          fill="url(#goldMain)"
          opacity="0.85"
        />
        <!-- Direita interior -->
        <polygon
          points="148,30 128,30 110,92 121,92"
          fill="url(#goldMain)"
          opacity="0.85"
        />

        <!-- ============================================ -->
        <!-- BRILHO / HIGHLIGHT (reflexo de luz) -->
        <!-- ============================================ -->
        <!-- Highlight esquerdo topo -->
        <polygon
          points="20,30 45,30 70,90 55,90"
          fill="url(#shine)"
          opacity="0.4"
        />
        <!-- Highlight direito topo -->
        <polygon
          points="200,30 175,30 150,90 165,90"
          fill="url(#shine)"
          opacity="0.3"
        />

        <!-- Linha de brilho central (ponto mais brilhante) -->
        <line x1="110" y1="30" x2="110" y2="155"
          stroke="rgba(255,235,150,0.3)"
          stroke-width="2"
          filter="url(#glowStrong)"
        />

        <!-- Ponto de brilho no topo -->
        <circle cx="110" cy="155" r="4"
          fill="#FFE59A"
          filter="url(#glowStrong)"
          opacity="0.9"
        />

        <!-- ============================================ -->
        <!-- CIRCUITOS DECORATIVOS (como no logo original) -->
        <!-- ============================================ -->
        <!-- Circuitos à esquerda -->
        <g opacity="0.6" filter="url(#glow)">
          <!-- Linha horizontal esquerda topo -->
          <line x1="20" y1="68" x2="60" y2="68" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="20" cy="68" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
          <!-- Linha horizontal esquerda meio -->
          <line x1="30" y1="90" x2="68" y2="90" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="30" cy="90" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
          <!-- Linha horizontal esquerda baixo -->
          <line x1="18" y1="112" x2="52" y2="112" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="18" cy="112" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
        </g>

        <!-- Circuitos à direita -->
        <g opacity="0.6" filter="url(#glow)">
          <!-- Linha horizontal direita topo -->
          <line x1="200" y1="68" x2="160" y2="68" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="200" cy="68" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
          <!-- Linha horizontal direita meio -->
          <line x1="190" y1="90" x2="152" y2="90" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="190" cy="90" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
          <!-- Linha horizontal direita baixo -->
          <line x1="202" y1="112" x2="168" y2="112" stroke="#C8A96B" stroke-width="1.5"/>
          <circle cx="202" cy="112" r="3.5" fill="none" stroke="#C8A96B" stroke-width="1.5"/>
        </g>

        <!-- ============================================ -->
        <!-- BORDA DOURADA FINA (contorno premium) -->
        <!-- ============================================ -->
        <polygon
          points="20,30 65,30 110,155 85,155"
          fill="none"
          stroke="rgba(255,220,100,0.35)"
          stroke-width="0.8"
        />
        <polygon
          points="200,30 155,30 110,155 135,155"
          fill="none"
          stroke="rgba(255,220,100,0.35)"
          stroke-width="0.8"
        />

        <!-- Linha de brilho animada que percorre o V -->
        <animateTransform/>
      </svg>

      <!-- Linha de scan animada (efeito tech) -->
      <div style="
        position:absolute;
        top:0; left:0; right:0;
        height:2px;
        background:linear-gradient(90deg,transparent,rgba(200,169,107,0.6),transparent);
        animation:scanLine 4s ease-in-out infinite;
        pointer-events:none;
      "></div>

    </div>
  </div>

</div>

<style>
@keyframes scanLine {
  0% { top: 10%; opacity:0; }
  10% { opacity:1; }
  90% { opacity:0.5; }
  100% { top: 90%; opacity:0; }
}
</style>

</body>
</html>
